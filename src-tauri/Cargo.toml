[package]
name = "catatan-anti-typo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Ada beberapa binary di src/bin/ (bench_corrector, eval_corrector, explain_word)
# untuk pengukuran & diagnosis. Tanpa baris ini `cargo run` bingung mau jalankan
# yang mana dan `npm run tauri dev` gagal.
default-run = "catatan-anti-typo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "catatan_anti_typo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.7.0"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
anyhow = "1.0.104"
thiserror = "2.0.20"
once_cell = "1.21.4"
parking_lot = "0.12.5"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.7.2"
docx-rs = "0.4.22"
printpdf = "0.7"

